name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Install restic and sqlite3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq restic sqlite3
          else
            choco install restic -y --no-progress
            choco install sqlite -y --no-progress || true
          fi

      - name: Install harness CLIs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.327 \
            @openai/codex@0.170.0 \
            opencode-ai@1.19.6 \
            --no-audit --no-fund
          echo "$(npm prefix -g)" >> "$GITHUB_PATH"

      - name: Smoke
        run: node tests/smoke.mjs
